name: HAP harness smoke

on:
  push:
    branches: [master]
    paths:
      - "custom_components/**"
      - "tests/harness/**"
      - ".github/workflows/harness-smoke.yml"
  schedule:
    # Weekly, so a new Home Assistant release cannot quietly change the
    # accessory shape without something failing.
    - cron: "0 17 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Mock climate to HomeKit (${{ matrix.core }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Latest release without native HeaterCooler support. Always pinned:
          # a rolling tag here would jump to 2026.8 the day it ships and stop
          # covering the generation this leg exists to cover.
          - core: legacy
            image: ghcr.io/home-assistant/home-assistant:2026.7.4
            configuration: configuration.yaml
            native: "no"
          # First stable release line carrying native support. This tracks
          # 2026.8 patch releases while the legacy leg stays fixed at the last
          # core without native HeaterCooler support.
          - core: native
            image: ghcr.io/home-assistant/home-assistant:2026.8
            configuration: configuration-native.yaml
            native: "yes"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: teh-hippo/ha-test-harness
          path: harness

      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          python-version: "3.14"

      - name: Start the disposable Home Assistant bridge
        env:
          CONFIG: ${{ runner.temp }}/heatercooler-harness
          HA_IMAGE: ${{ matrix.image }}
          HARNESS_CONFIGURATION: ${{ matrix.configuration }}
        run: |
          set -euo pipefail
          harness/podman/ha-bench.sh \
            --engine docker \
            --name heatercooler-harness \
            --image "$HA_IMAGE" \
            --config "$CONFIG" \
            --host-net \
            --recreate \
            --component "$GITHUB_WORKSPACE/harness/mocks/custom_components/mock_climate" \
            --component "$GITHUB_WORKSPACE/custom_components/homekit_heatercooler" \
            --seed-config "$GITHUB_WORKSPACE/tests/harness/$HARNESS_CONFIGURATION"

      # Asserts the capability that splits the two legs rather than a version
      # string. A version prefix cannot work once the image is a rolling tag,
      # and native HeaterCooler support is the thing each leg actually exists
      # to exercise, so test that directly.
      - name: Assert the core generation under test
        env:
          EXPECT_NATIVE: ${{ matrix.native }}
        run: |
          set -euo pipefail
          version="$(docker exec -i heatercooler-harness \
            python -c 'from homeassistant.const import __version__ as v; print(v)')"
          native="$(docker exec -i heatercooler-harness python -c '
          import importlib.util

          spec = importlib.util.find_spec(
              "homeassistant.components.homekit.type_heater_coolers"
          )
          print("yes" if spec else "no")
          ' 2>/dev/null)"
          echo "Home Assistant $version (native HeaterCooler: $native)"
          if [ "$native" != "$EXPECT_NATIVE" ]; then
            echo "::error::${{ matrix.core }} leg expected native HeaterCooler" \
              "$EXPECT_NATIVE, got $native on $version" >&2
            exit 1
          fi

      - name: Pair and verify the bridge
        env:
          CONFIG: ${{ runner.temp }}/heatercooler-harness
          HARNESS_HOMEKIT_DIR: ${{ github.workspace }}/harness/homekit
          HA_URL: http://127.0.0.1:18127
          CORE: ${{ matrix.core }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            if curl -fsS "$HA_URL/api/onboarding" >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS "$HA_URL/api/onboarding" >/dev/null

          for _ in $(seq 1 60); do
            if grep -Fq "routing loaded (mode=bundled," "$CONFIG/home-assistant.log" \
              && grep -Eq 'Pincode: [0-9]{3}-[0-9]{2}-[0-9]{3}' "$CONFIG/home-assistant.log"; then
              break
            fi
            sleep 2
          done
          grep -Fq "routing loaded (mode=bundled," "$CONFIG/home-assistant.log"
          PIN="$(python - "$CONFIG/home-assistant.log" <<'PY'
          from pathlib import Path
          import re
          import sys

          matches = re.findall(
              r"Pincode: (\d{3}-\d{2}-\d{3})",
              Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace"),
          )
          if not matches:
              raise SystemExit("HomeKit pairing code not found")
          print(matches[-1])
          PY
          )"
          DEVICE_ID="$(docker exec -i heatercooler-harness python - <<'PY'
          from pathlib import Path
          import json

          state_path = next(Path("/config/.storage").glob("homekit.*.state"))
          print(json.loads(state_path.read_text(encoding="utf-8"))["mac"])
          PY
          )"
          HA_TOKEN="$(python harness/rest/onboard.py --url "$HA_URL" --token-only)"

          cd "$HARNESS_HOMEKIT_DIR"
          uv venv
          uv pip install aiohomekit

          HC_DEVICE_ID="$DEVICE_ID" HC_PIN="$PIN" HC_IP=127.0.0.1 HC_PORT=21063 \
            HC_PAIRING_FILE="${RUNNER_TEMP}/heatercooler-shape-pairing.json" \
            .venv/bin/python smoke.py --force-fallback

          HARNESS_HOMEKIT_DIR="$HARNESS_HOMEKIT_DIR" \
            HA_URL="$HA_URL" \
            HA_TOKEN="$HA_TOKEN" \
            HC_CORE="$CORE" \
            HC_DEVICE_ID="$DEVICE_ID" \
            HC_PIN="$PIN" \
            HC_IP=127.0.0.1 \
            HC_PORT=21063 \
            .venv/bin/python "$GITHUB_WORKSPACE/tests/harness/hap_write_smoke.py"

      - name: Remove disposable bridge
        if: always()
        run: docker rm -f heatercooler-harness || true

  upgrade:
    name: Already-paired upgrade (${{ matrix.scenario }} on ${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # The core moves under a bridge that is already paired with our
          # accessory. The shape has to hold across the generation change.
          - scenario: core-upgrade
            label: 2026.7 to 2026.8
            before: ghcr.io/home-assistant/home-assistant:2026.7.4
            after: ghcr.io/home-assistant/home-assistant:2026.8
          # An existing user installs the integration. Core serves a Thermostat
          # on this generation, so the service type changes outright.
          - scenario: adopt
            label: "2026.7"
            before: ghcr.io/home-assistant/home-assistant:2026.7.4
            after: ghcr.io/home-assistant/home-assistant:2026.7.4
          # The same adoption, but starting from core's own HeaterCooler and its
          # linked fan tile rather than a Thermostat.
          - scenario: adopt
            label: "2026.8"
            before: ghcr.io/home-assistant/home-assistant:2026.8
            after: ghcr.io/home-assistant/home-assistant:2026.8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: teh-hippo/ha-test-harness
          path: harness

      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          python-version: "3.14"

      - name: Pair, change the bridge underneath, and reconnect
        run: |
          tests/harness/upgrade_smoke.sh \
            --scenario "${{ matrix.scenario }}" \
            --harness "$GITHUB_WORKSPACE/harness" \
            --engine docker \
            --name heatercooler-upgrade \
            --before-image "${{ matrix.before }}" \
            --after-image "${{ matrix.after }}" \
            --workdir "${{ runner.temp }}/heatercooler-upgrade"

      - name: Remove disposable bridge
        if: always()
        run: docker rm -f heatercooler-upgrade || true
