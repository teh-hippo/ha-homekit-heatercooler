name: Validate

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: validate-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: home-assistant/actions/hassfest@f6f29a7ee3fa0eccadf3620a7b9ee00ab54ec03b  # master pinned 2026-05-07

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: HACS validation
        uses: hacs/action@dcb30e72781db3f207d5236b861172774ab0b485  # main pinned 2026-05-07
        with:
          category: integration
          comment: false
          github_token: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .

  mypy:
    name: Mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv run --no-sync mypy custom_components/homekit_heatercooler

  test:
    name: Test (${{ matrix.core }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - core: legacy
            group: test-legacy
            native: "no"
          - core: native
            group: test-native
            native: "yes"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
          cache-suffix: ${{ matrix.group }}
      - run: uv sync --locked --no-default-groups --group dev --group ${{ matrix.group }}
      # Guards against a dependency bump silently swapping core generations,
      # which is exactly how the beta first arrived. Asserting the presence of
      # native HeaterCooler rather than a version prefix tests the property
      # that decides which code path this leg covers.
      - name: Assert the core generation under test
        env:
          EXPECT_NATIVE: ${{ matrix.native }}
        run: |
          set -euo pipefail
          version="$(uv run --no-sync python -c 'from homeassistant.const import __version__ as v; print(v)')"
          native="$(uv run --no-sync python -c '
          import importlib.util

          spec = importlib.util.find_spec(
              "homeassistant.components.homekit.type_heater_coolers"
          )
          print("yes" if spec else "no")
          ' 2>/dev/null)"
          echo "Home Assistant $version (native HeaterCooler: $native)"
          if [ "$native" != "$EXPECT_NATIVE" ]; then
            echo "::error::${{ matrix.core }} leg expected native HeaterCooler" \
              "$EXPECT_NATIVE, got $native on $version" >&2
            exit 1
          fi
      - run: uv run --no-sync coverage run -m pytest tests/ -v --tb=short
      - run: uv run --no-sync coverage report --include="custom_components/homekit_heatercooler/*" --fail-under=70

  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv run --no-sync python -m compileall custom_components
